<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Настройки GPT</title>
    <link rel="stylesheet" href="/app.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <main class="container">
      <section class="card card-hero">
        <h1 class="title">⚙️ Настройки GPT</h1>
        <p class="subtitle">Выбери модель в выпадающем списке и сохрани.</p>
      </section>
      <section class="card">
        <label class="label" for="model-select">Модель чата</label>
        <select id="model-select" class="select"></select>
        <div class="small mt-10" id="model-hint"></div>
      </section>

      <section class="card">
        <label class="label" for="chat-select">Активный чат</label>
        <select id="chat-select" class="select"></select>
        <div class="small mt-10" id="chat-hint"></div>
        <div class="actions">
          <button id="new-chat-btn" class="btn-secondary">🆕 Новый чат</button>
          <button id="open-chat-btn" class="btn-secondary">📖 Открыть чат</button>
          <button id="save-close-btn" class="btn-primary">Сохранить и закрыть</button>
          <button id="refresh-btn" class="btn-secondary">Обновить</button>
        </div>
        <div id="status" class="status"></div>
      </section>
    </main>
    <script src="/settings.js" type="module"></script>
  </body>
</html>
